<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Praktik Flutter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0f172a; --bg-panel: #1e293b; --primary: #3b82f6; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border: rgba(255,255,255,0.1); --error: #ef4444; --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        .flex-center { display: flex; justify-content: center; align-items: center; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* LOGIN */
        #login-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); z-index: 100; }
        .login-card { background: rgba(30,41,59,0.8); backdrop-filter: blur(12px); border: 1px solid var(--border); padding: 40px; border-radius: 16px; width: 360px; text-align: center; }
        .input-group input { width: 100%; padding: 14px; margin: 20px 0; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; color: white; text-align: center; font-size: 16px; letter-spacing: 1px; }
        .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-primary:disabled { background: #475569; cursor: not-allowed; transform: none; }

        /* DASHBOARD */
        .app-layout { display: flex; height: 100vh; }
        .sidebar { width: 450px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; box-shadow: 5px 0 20px rgba(0,0,0,0.3); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: rgba(15, 23, 42, 0.5); }
        .timer-box { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: #fca5a5; padding: 6px 12px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-weight: 700; text-align: center; margin-top: 10px; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 20px; }

        /* SOAL CARD */
        .card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
        .card-title { font-size: 13px; font-weight: 700; color: var(--success); text-transform: uppercase; }
        .card-badge { font-size: 11px; background: rgba(16, 185, 129, 0.1); color: var(--success); padding: 2px 6px; border-radius: 4px; }
        .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
        code { background: rgba(255,255,255,0.1); color: #93c5fd; padding: 2px 5px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }

        .submit-section { padding: 20px; background: rgba(15, 23, 42, 0.5); border-top: 1px solid var(--border); }
        textarea.code-area { width: 100%; height: 100px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 15px; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 11px; resize: none; margin-bottom: 10px; }
        .main-panel { flex: 1; background: black; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="login-screen" class="flex-center">
        <div class="login-card">
            <h2>Ujian Praktik Flutter</h2>
            <div id="status-text" style="margin-bottom: 20px; font-size: 12px; color: var(--text-muted);">
                <svg class="spin" style="width:12px; height:12px;" viewBox="0 0 24 24"><path fill="currentColor" d="M12,4V2A10,10 0 0,0 2,12H4A8,8 0 0,1 12,4Z"/></svg> 
                Memuat Jadwal & Soal...
            </div>
            <div class="input-group">
                <input type="text" id="nim" placeholder="MASUKKAN NIM" autocomplete="off">
            </div>
            <button id="btn-login" class="btn-primary" onclick="handleLogin()" disabled>MASUK</button>
            <p id="error-msg" style="color:var(--error); font-size:12px; margin-top:15px;"></p>
        </div>
    </div>

    <div id="dashboard" class="app-layout hidden">
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="font-size: 11px; color: var(--text-muted);">Peserta: <strong id="display-name" style="color: white;">-</strong></div>
                <div class="timer-box" id="timer">00:00:00</div>
            </div>
            <div class="sidebar-content" id="soal-container">
                <div style="text-align:center; margin-top:50px; color:gray">Memuat Soal...</div>
            </div>
            <div class="submit-section">
                <textarea id="code-submit" class="code-area" placeholder="// Salin kode dari DartPad dan tempel di sini..."></textarea>
                <button id="btn-submit" class="btn-primary" onclick="handleSubmit()">KIRIM JAWABAN</button>
            </div>
        </div>
        <div class="main-panel">
            <iframe src="https://dartpad.dev/embed-flutter.html?theme=dark&run=true&split=60"></iframe>
        </div>
    </div>

<script>
    // ⚠️ PASTE URL SCRIPT BAPAK DI SINI ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbwPqXj1WNNYN4akkA-9dfsEb8I6Aotv0M6qSdQVP5CCcKQhufR-p0hCd43GTmihxppj/exec"; 

    let userData = { nama: "", nim: "" };
    let examEndTime = null;
    let daftarSoal = []; // Soal akan disimpan di sini setelah didownload

    // --- 1. INISIALISASI (LOAD JADWAL & SOAL) ---
    window.onload = async () => {
        if(API_URL.includes("PASTE_URL")) return alert("URL Script belum disetting!");

        // Ambil Jadwal
        const jadwal = await fetchData({ action: "get_schedule" });
        if(jadwal) checkJadwal(jadwal);
        else document.getElementById("status-text").innerText = "Gagal Koneksi Server";

        // Ambil Soal (Background)
        const soalData = await fetchData({ action: "get_questions" });
        if(soalData && Array.isArray(soalData)) {
            daftarSoal = soalData; // Simpan ke variabel global
            console.log("Soal Berhasil Dimuat:", daftarSoal.length);
        }
    };

    // --- RENDER SOAL (Saat Login Sukses) ---
    function renderSoalToUI() {
        const container = document.getElementById("soal-container");
        if(daftarSoal.length === 0) {
            container.innerHTML = "<p style='color:red'>Gagal memuat soal. Refresh halaman.</p>";
            return;
        }

        let html = "";
        daftarSoal.forEach(soal => {
            html += `
            <div class="card">
                <div class="card-header">
                    <div class="card-title">${soal.judul}</div>
                    <div class="card-badge">${soal.poin} Poin</div>
                </div>
                <div class="card-desc">${soal.isi}</div>
            </div>`;
        });
        
        html += `<div class="card" style="border-color:#3b82f6; background:rgba(59,130,246,0.1)">
            <div class="card-desc" style="color:#93c5fd">Instruksi: Pastikan kode berjalan di DartPad, lalu Copy-Paste ke bawah.</div>
        </div>`;

        container.innerHTML = html;
    }

    // --- LOGIKA JADWAL ---
    function checkJadwal(jadwal) {
        const now = new Date();
        const start = new Date(jadwal.tanggal.replace(/-/g, "/") + " " + jadwal.jam_mulai);
        const end = new Date(jadwal.tanggal.replace(/-/g, "/") + " " + jadwal.jam_selesai);
        examEndTime = end;

        const info = document.getElementById("status-text");
        const btn = document.getElementById("btn-login");

        if (now < start) {
            info.innerHTML = `<span style="color:#ef4444">⛔ BELUM DIMULAI (${jadwal.jam_mulai})</span>`;
            btn.disabled = true;
        } else if (now > end) {
            info.innerHTML = `<span style="color:#ef4444">⛔ WAKTU HABIS</span>`;
            btn.disabled = true;
        } else {
            info.innerHTML = `<span style="color:#10b981">✅ UJIAN BERLANGSUNG</span>`;
            btn.disabled = false;
        }
    }

    // --- LOGIN ---
    async function handleLogin() {
        const nim = document.getElementById("nim").value.trim();
        const btn = document.getElementById("btn-login");
        
        if(!nim) return;
        btn.disabled = true; btn.innerText = "CEK DATA...";

        const res = await fetchData({ action: "login", nim: nim });

        if(res && res.status === "ok") {
            userData = { nama: res.nama, nim: nim };
            renderSoalToUI(); // Tampilkan soal
            
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");
            document.getElementById("display-name").innerText = res.nama;
            startTimer();
        } else {
            document.getElementById("error-msg").innerText = res ? "NIM Tidak Terdaftar" : "Error";
            btn.disabled = false; btn.innerText = "MASUK";
        }
    }

    // --- TIMER ---
    function startTimer() {
        const el = document.getElementById("timer");
        setInterval(() => {
            const diff = examEndTime - new Date();
            if(diff <= 0) { el.innerText = "00:00:00"; handleSubmit(true); return; }
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            el.innerText = `${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        }, 1000);
    }

    // --- SUBMIT ---
    async function handleSubmit(force = false) {
        const code = document.getElementById("code-submit").value;
        if(!force && !confirm("Kirim Jawaban Final?")) return;

        const btn = document.getElementById("btn-submit");
        btn.disabled = true; btn.innerText = "MENILAI...";

        // HITUNG NILAI BERDASARKAN SOAL DARI SPREADSHEET
        let totalScore = 0;
        
        if (daftarSoal.length > 0) {
            daftarSoal.forEach(soal => {
                // Kunci jawaban dari sheet (array string)
                // Kita cek apakah kode mahasiswa mengandung kata kunci tersebut
                // Logika: Benar jika SEMUA kata kunci dalam satu soal ditemukan
                const kunciArr = soal.kunci; 
                const isCorrect = kunciArr.every(k => code.includes(k));
                
                if(isCorrect) totalScore += soal.poin;
            });
        }

        const res = await fetchData({
            action: "submit",
            nama: userData.nama,
            nim: userData.nim,
            nilai: totalScore
        });

        if(res && res.result === "success") {
            document.body.innerHTML = `<div class="flex-center" style="height:100vh;flex-direction:column;color:white;text-align:center"><h1>🎉 Selesai!</h1><p>Nilai: ${totalScore}</p></div>`;
        } else {
            alert("Gagal: " + (res?.msg || "Error"));
            btn.disabled = false; btn.innerText = "KIRIM ULANG";
        }
    }

    async function fetchData(payload) {
        try {
            const req = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
            return await req.json();
        } catch (e) { return null; }
    }
</script>
</body>
</html>
